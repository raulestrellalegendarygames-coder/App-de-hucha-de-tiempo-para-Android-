name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP files
        run: |
          for zip in $(find . -maxdepth 2 -name "*.zip"); do
            echo "Unzipping $zip..."
            unzip -o "$zip"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Gradle and Build APK
        run: |
          # Buscar la carpeta donde quedó descomprimido el proyecto
          PROJECT_DIR=$(find . -name "build.gradle" -not -path "*/app/*" -exec dirname {} \;)
          echo "Project directory found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Generar ejecutable gradlew si no existe
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
          
